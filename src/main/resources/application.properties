spring.application.name=SecureTask

# DataSource is configured programmatically from Secrets Manager.
# Do not add spring.datasource.* credentials here.

# ddl-auto=update is intentional for local development — it creates and migrates
# tables automatically. Production deployments must override this to 'validate'
# and use a schema migration tool (Flyway or Liquibase) instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Session
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# Set secure=true in production (HTTPS only). Omitted here so local HTTP dev works.
# Production override: server.servlet.session.cookie.secure=true

# SSRF — outbound webhook allowlist (suffix matching: discord.com also allows webhooks.discord.com)
ssrf.allowed-domains=hooks.slack.com,discord.com,webhook.office.com,hooks.zapier.com,api.pagerduty.com

# AWS / Secrets Manager — override per environment
aws.region=${AWS_REGION:us-east-1}
aws.secretsmanager.endpoint=${SECRETS_MANAGER_ENDPOINT:}
aws.secretsmanager.secretName=${DB_SECRET_NAME:securetask/db}

# File upload — task attachments use local storage, profile avatars use S3
upload.local.directory=${UPLOAD_DIR:uploads}
upload.s3.bucket=${S3_BUCKET_NAME:securetask-uploads}
upload.s3.endpoint=${S3_ENDPOINT:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
