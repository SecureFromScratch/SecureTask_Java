<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel – SecureTask</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .admin-container {
            max-width: 860px;
            margin: 40px auto;
            padding: 2rem;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-size: .9rem;
        }

        th {
            text-align: left;
            padding: .5rem .75rem;
            background: #f0f0f0;
            border-bottom: 2px solid #ddd;
            font-weight: 600;
        }

        td {
            padding: .5rem .75rem;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: none; }

        .role-select {
            padding: .3rem .5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: .85rem;
            margin-right: .4rem;
        }

        .save-btn {
            padding: .3rem .75rem;
            background: #0066cc;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: .85rem;
            cursor: pointer;
        }

        .save-btn:hover { background: #0052a3; }
        .save-btn:disabled { background: #999; cursor: not-allowed; }

        .self-note {
            font-size: .8rem;
            color: #888;
            font-style: italic;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: .9rem;
            color: #555;
        }

        .back-link {
            font-size: .85rem;
            color: #0066cc;
            text-decoration: none;
        }

        .back-link:hover { text-decoration: underline; }

        #logout-btn {
            background: none;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: .3rem .8rem;
            cursor: pointer;
            font-size: .85rem;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="page-header">
            <h1>Admin Panel</h1>
            <div class="header-right">
                <a href="/dashboard.html" class="back-link">← Dashboard</a>
                <span id="current-username"></span>
                <button id="logout-btn">Log out</button>
            </div>
        </div>

        <div id="message" class="message" style="display:none;"></div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="users-tbody">
                <tr><td colspan="5">Loading…</td></tr>
            </tbody>
        </table>
    </div>

    <script src="/js/dom.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
