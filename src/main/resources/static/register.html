<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – SecureTask</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Create account</h1>
        <form id="register-form" novalidate>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required minlength="3" maxlength="64">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required maxlength="254">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8" maxlength="128">
            </div>
            <button type="submit">Register</button>
        </form>
        <div id="message" class="message" style="display:none;"></div>
        <div class="link-row">Already have an account? <a href="/login.html">Log in</a></div>
    </div>
    <script src="/js/dom.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.getElementById("register-form").addEventListener("submit", handleRegister);
    </script>
</body>
</html>
