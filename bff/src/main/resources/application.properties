server.port=8081
# Serve frontend/ directly in local dev so edits are visible without rebuilding.
# In production the jar already contains the files via the processResources task.
spring.web.resources.static-locations=file:frontend/,classpath:/static/
bff.api.base-url=${API_BASE_URL:http://localhost:8080}
bff.service-token=${BFF_SERVICE_TOKEN:securetask-bff-token}

# Session config — keep tokens in server memory, never expose to browser
spring.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# Different name from main app's JSESSIONID so both can run on localhost simultaneously
server.servlet.session.cookie.name=BFF-SESSION

# Disable multipart parsing so the proxy can forward raw multipart bodies unchanged
spring.servlet.multipart.enabled=false
